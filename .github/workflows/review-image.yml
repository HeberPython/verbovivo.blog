name: Replace one pending review image
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        required: true
        default: inspect
        options: [inspect, generate, apply]
      subject:
        description: Exact original email subject
        required: true
        type: string
      generation_run:
        description: Generation run ID, required for apply
        type: string
      direction:
        description: Optional image-only scene direction
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: verbo-vivo-editorial-agent
  cancel-in-progress: false
jobs:
  review-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOSTINGER_FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
      HOSTINGER_FTP_PORT: ${{ secrets.HOSTINGER_FTP_PORT }}
      HOSTINGER_FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
      HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
      HOSTINGER_FTP_DIR: ${{ secrets.HOSTINGER_FTP_DIR }}
      EDITORIAL_ADMIN_TOKEN: ${{ secrets.EDITORIAL_ADMIN_TOKEN }}
      EDITORIAL_SMTP_HOST: ${{ secrets.EDITORIAL_SMTP_HOST }}
      EDITORIAL_SMTP_PORT: ${{ secrets.EDITORIAL_SMTP_PORT }}
      EDITORIAL_SMTP_USER: ${{ secrets.EDITORIAL_SMTP_USER }}
      EDITORIAL_SMTP_PASSWORD: ${{ secrets.EDITORIAL_SMTP_PASSWORD }}
      EDITORIAL_APPROVER_EMAIL: ${{ secrets.EDITORIAL_APPROVER_EMAIL }}
      EDITORIAL_APPROVAL_BASE_URL: ${{ secrets.EDITORIAL_APPROVAL_BASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_IMAGE_MODEL: gemini-3.1-flash-image
      REVIEW_SUBJECT: ${{ inputs.subject }}
      REVIEW_DIRECTION: ${{ inputs.direction }}
      REVIEW_ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: php -l automation/review-image-update.php
      - uses: actions/download-artifact@v4
        if: inputs.action == 'apply'
        with:
          name: pending-review-image
          path: automation/_diagnostics/pending-review-image
          run-id: ${{ inputs.generation_run }}
          github-token: ${{ github.token }}
      - run: python -m automation.editorial_agent.review_image
      - uses: actions/upload-artifact@v4
        if: inputs.action == 'generate'
        with:
          name: pending-review-image
          path: automation/_diagnostics/pending-review-image
          retention-days: 7
          if-no-files-found: error
