name: Phase 2A - extract preserved Lesson 13 only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verbo-vivo-editorial-agent
  cancel-in-progress: false
jobs:
  extract-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Extract exact preserved message without publishing or marking read
        env:
          EDITORIAL_IMAP_HOST: ${{ secrets.EDITORIAL_IMAP_HOST }}
          EDITORIAL_IMAP_PORT: ${{ secrets.EDITORIAL_IMAP_PORT }}
          EDITORIAL_IMAP_USER: ${{ secrets.EDITORIAL_IMAP_USER }}
          EDITORIAL_IMAP_PASSWORD: ${{ secrets.EDITORIAL_IMAP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-3.6-flash
        run: python -m automation.extract_lesson13
      - uses: actions/upload-artifact@v4
        with:
          name: phase2a-lesson13-extraction-${{ github.run_id }}
          path: automation/_backups/phase2a-lesson13-extraction
          if-no-files-found: error
          retention-days: 7
